<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="410"
  viewBox="0 0 760 410"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Skills Overview</title>
  <desc id="description">
    Illustrative skill scores, not measured proficiency.
    Replace these sample scores with your own self-assessment.
  </desc>


  <defs>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388BFD"/>
      <stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>

    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#56D364"/>
    </linearGradient>

    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>

    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957E5"/>
      <stop offset="100%" stop-color="#D2A8FF"/>
    </linearGradient>

    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Helvetica, Arial, sans-serif;
      }

      .heading {
        fill: #F0F6FC;
        font-size: 22px;
        font-weight: 600;
      }

      .subtitle {
        fill: #8B949E;
        font-size: 12px;
      }

      .label {
        fill: #C9D1D9;
        font-size: 14px;
        font-weight: 500;
      }

      .score {
        fill: #8B949E;
        font-size: 13px;
        text-anchor: end;
      }

      .track {
        fill: #21262D;
      }
    </style>
  </defs>

  <!-- Card -->
  <rect
    x="0.5"
    y="0.5"
    width="759"
    height="409"
    rx="16"
    fill="#0D1117"
    stroke="#30363D"
  />

  <!-- Heading -->
  <text x="30" y="43" class="heading">Skills Overview</text>
  <text x="30" y="67" class="subtitle">
    Sample values — customize with your own self-assessment.
  </text>

  <line
    x1="30"
    y1="88"
    x2="730"
    y2="88"
    stroke="#21262D"
  />

  <!-- Python -->
  <text x="30" y="124" class="label">Python</text>
  <rect x="210" y="112" width="440" height="14" rx="7" class="track"/>
  <rect x="210" y="112" width="352" height="14" rx="7" fill="url(#blue)"/>
  <text x="720" y="124" class="score">80%</text>

  <!-- PostgreSQL / SQL -->
  <text x="30" y="168" class="label">PostgreSQL / SQL</text>
  <rect x="210" y="156" width="440" height="14" rx="7" class="track"/>
  <rect x="210" y="156" width="308" height="14" rx="7" fill="url(#blue)"/>
  <text x="720" y="168" class="score">70%</text>

  <!-- FastAPI -->
  <text x="30" y="212" class="label">FastAPI</text>
  <rect x="210" y="200" width="440" height="14" rx="7" class="track"/>
  <rect x="210" y="200" width="330" height="14" rx="7" fill="url(#teal)"/>
  <text x="720" y="212" class="score">75%</text>

  <!-- Django -->
  <text x="30" y="256" class="label">Django</text>
  <rect x="210" y="244" width="440" height="14" rx="7" class="track"/>
  <rect x="210" y="244" width="286" height="14" rx="7" fill="url(#green)"/>
  <text x="720" y="256" class="score">65%</text>

  <!-- SQLAlchemy -->
  <text x="30" y="300" class="label">SQLAlchemy</text>
  <rect x="210" y="288" width="440" height="14" rx="7" class="track"/>
  <rect x="210" y="288" width="264" height="14" rx="7" fill="url(#teal)"/>
  <text x="720" y="300" class="score">60%</text>

  <!-- Machine Learning -->
  <text x="30" y="344" class="label">Machine Learning</text>
  <rect x="210" y="332" width="440" height="14" rx="7" class="track"/>
  <rect x="210" y="332" width="220" height="14" rx="7" fill="url(#purple)"/>
  <text x="720" y="344" class="score">50%</text>

  <!-- Footer -->
  <text x="30" y="385" class="subtitle">
    Manually maintained · Not calculated from GitHub activity
  </text>
</svg>
